name: Publish ClipStack release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version, for example 1.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $version = $env:REQUESTED_VERSION
          } else {
            $version = $env:GITHUB_REF_NAME.TrimStart("v")
          }

          if ($version -notmatch '\A[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?\z') {
            throw "Invalid semantic version: $version"
          }

          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Restore Velopack tool
        shell: pwsh
        run: dotnet tool restore

      - name: Download previous release metadata
        shell: pwsh
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet tool run vpk download github `
            --repoUrl "https://github.com/$env:GITHUB_REPOSITORY" `
            --token $env:RELEASE_TOKEN `
            --channel win `
            --outputDir artifacts/releases

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Could not download the previous release. Creating a full package."
          }

      - name: Build and package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: .\tools\build-release.ps1 -Version $env:RELEASE_VERSION

      - name: Publish GitHub release
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet tool run vpk upload github `
            --repoUrl "https://github.com/$env:GITHUB_REPOSITORY" `
            --token $env:RELEASE_TOKEN `
            --channel win `
            --outputDir artifacts/releases `
            --publish `
            --tag "v$env:RELEASE_VERSION" `
            --releaseName "ClipStack $env:RELEASE_VERSION" `
            --targetCommitish $env:GITHUB_SHA

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release upload failed with exit code $LASTEXITCODE."
          }
