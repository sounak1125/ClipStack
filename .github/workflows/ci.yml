name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A superseded run on the same branch has nothing left to tell us.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore .\ClipStack.sln

      - name: Build
        run: dotnet build .\ClipStack.sln -c Release --no-restore

      - name: Test
        run: dotnet test .\ClipStack.sln -c Release --no-build --verbosity normal
